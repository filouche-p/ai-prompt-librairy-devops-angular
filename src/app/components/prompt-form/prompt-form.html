<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
  <h2
    id="add-prompt-heading"
    class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2"
  >
    <svg
      class="w-5 h-5 text-indigo-500"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
    </svg>
    Ajouter un prompt
  </h2>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    id="addPrompt"
    aria-labelledby="add-prompt-heading"
    novalidate
    class="flex flex-col gap-4"
  >
    <div>
      <label for="title" class="block text-sm font-semibold text-slate-700 mb-1">
        Titre <span class="text-rose-600" aria-hidden="true">*</span>
      </label>
      <input
        #titleInput
        type="text"
        id="title"
        name="title"
        formControlName="title"
        required
        enterkeyhint="next"
        placeholder="Ex: Générer un composant Angular"
        [attr.aria-invalid]="isInvalid('title') ? 'true' : null"
        [attr.aria-describedby]="isInvalid('title') ? 'title-error' : null"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm"
        [class.border-rose-500]="isInvalid('title')"
      />
      @if (isInvalid('title')) {
        <p id="title-error" class="mt-1 text-xs text-rose-600 font-medium">
          Veuillez saisir un titre pour le prompt.
        </p>
      }
    </div>

    <div>
      <label for="category" class="block text-sm font-semibold text-slate-700 mb-1">
        Catégorie <span class="text-rose-600" aria-hidden="true">*</span>
      </label>
      <input
        #categoryInput
        type="text"
        id="category"
        name="category"
        formControlName="category"
        required
        enterkeyhint="next"
        placeholder="Ex: Développement"
        [attr.aria-invalid]="isInvalid('category') ? 'true' : null"
        [attr.aria-describedby]="isInvalid('category') ? 'category-error' : null"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm"
        [class.border-rose-500]="isInvalid('category')"
      />
      @if (isInvalid('category')) {
        <p id="category-error" class="mt-1 text-xs text-rose-600 font-medium">
          Veuillez saisir une catégorie.
        </p>
      }
    </div>

    <div>
      <label for="prompt" class="block text-sm font-semibold text-slate-700 mb-1">
        Prompt <span class="text-rose-600" aria-hidden="true">*</span>
      </label>
      <textarea
        #promptInput
        id="prompt"
        name="prompt"
        formControlName="prompt"
        required
        rows="4"
        enterkeyhint="done"
        placeholder="Écris ton instruction pour l'IA ici..."
        [attr.aria-invalid]="isInvalid('prompt') ? 'true' : null"
        [attr.aria-describedby]="isInvalid('prompt') ? 'prompt-error' : null"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm resize-y"
        [class.border-rose-500]="isInvalid('prompt')"
      ></textarea>
      @if (isInvalid('prompt')) {
        <p id="prompt-error" class="mt-1 text-xs text-rose-600 font-medium">
          Veuillez saisir le contenu du prompt.
        </p>
      }
    </div>

    <button
      type="submit"
      class="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm cursor-pointer"
    >
      Enregistrer en mémoire
    </button>

    <p class="sr-only" role="status">{{ statusMessage() }}</p>
  </form>
</div>
