<article
  [id]="prompt().id"
  class="card bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-200 transition-all duration-200 flex flex-col h-full group relative overflow-hidden"
  [class.addedByUser]="prompt().addedByUser"
  [class.border-indigo-300]="prompt().addedByUser"
  [class.bg-indigo-50/30]="prompt().addedByUser"
>
  <div
    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-400 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity"
    aria-hidden="true"
  ></div>

  <div class="flex justify-between items-start gap-4 mb-3">
    <h3 class="text-base font-bold text-slate-800 leading-tight">{{ prompt().title }}</h3>
    <span
      class="shrink-0 bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-md font-semibold tracking-wide border border-indigo-100 uppercase"
    >
      {{ prompt().category }}
    </span>
  </div>

  <div class="bg-slate-50 p-4 rounded-lg border border-slate-100 flex-grow relative">
    <a
      [href]="promptUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="text-slate-600 text-sm font-mono whitespace-pre-wrap break-words leading-relaxed block pe-9 hover:text-indigo-700 transition-colors"
    >
      {{ prompt().prompt }}
    </a>

    <span class="absolute top-2 right-2 inline-flex items-center gap-1.5">
      <span
        class="copy-tip text-xs font-medium px-2 py-0.5 rounded shadow-sm border"
        [class.is-visible]="copyState() !== 'idle'"
        [class.bg-emerald-50]="copyState() === 'copied'"
        [class.text-emerald-700]="copyState() === 'copied'"
        [class.border-emerald-200]="copyState() === 'copied'"
        [class.bg-rose-50]="copyState() === 'failed'"
        [class.text-rose-700]="copyState() === 'failed'"
        [class.border-rose-200]="copyState() === 'failed'"
        role="status"
      >
        {{ statusMessage() }}
      </span>
      <button
        type="button"
        (click)="copyPrompt()"
        [attr.aria-label]="'Copier le prompt : ' + prompt().title"
        [attr.data-copied]="copyState() === 'copied' ? '' : null"
        [attr.data-failed]="copyState() === 'failed' ? '' : null"
        title="Copier le prompt"
        class="min-w-6 min-h-6 p-1 text-slate-400 hover:text-indigo-600 transition-colors bg-slate-50 rounded cursor-pointer flex items-center justify-center focus-visible:outline-2 focus-visible:outline-indigo-600"
      >
        @if (copyState() === 'copied') {
          <svg
            class="w-4 h-4 text-green-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            ></path>
          </svg>
        } @else if (copyState() === 'failed') {
          <svg
            class="w-4 h-4 text-rose-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        } @else {
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
            ></path>
          </svg>
        }
      </button>
    </span>
  </div>
</article>
